name: Python CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Safety net: job should never exceed 15 minutes under normal conditions.
    # Real subprocess-based MCP tests are skipped in CI (see test_mcp.py).
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Python 3.12 ships PidfdChildWatcher on Linux — signal-free child process
        # monitoring that is safe on background asyncio threads. This is the canonical
        # fix for the asyncio SIGCHLD deadlock present in Python 3.10 on Ubuntu.
        python-version: '3.12'

    - name: Cache Pip and Hugging Face Models
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.cache/huggingface
        key: ${{ runner.os }}-py312-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}-hf
        restore-keys: |
          ${{ runner.os }}-py312-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest pytest-mock ruff

    - name: Run Ruff Linter & Format Check
      run: |
        ruff check src/ tests/
        ruff format --check src/ tests/

    - name: Run tests
      env:
        PYTHONUNBUFFERED: "1"
        CI: "true"
      run: |
        pytest tests/ -v

    - name: Test Ingestion Smoke Test
      run: |
        python -m agentic_profile_matching.generate_dataset
        python -m agentic_profile_matching.resume_rag

