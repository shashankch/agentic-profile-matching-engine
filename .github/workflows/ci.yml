name: Python CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Pip and Hugging Face Models
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.cache/huggingface
        key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}-hf
        restore-keys: |
          ${{ runner.os }}-python-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest pytest-mock ruff

    - name: Run Ruff Linter & Format Check
      run: |
        ruff check src/ tests/
        ruff format --check src/ tests/

    - name: Run tests
      run: |
        pytest tests/

    - name: Test Ingestion Smoke Test
      run: |
        python -m agentic_profile_matching.generate_dataset
        python -m agentic_profile_matching.resume_rag

